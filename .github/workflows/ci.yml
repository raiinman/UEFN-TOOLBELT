name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Lint, types, tests
          - os: windows-latest
            name: Lint, types, tests (Windows)
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # UEFN 41.x/42.x embeds CPython 3.11 — match it so version-specific
          # syntax or stdlib differences surface here rather than in the editor.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-mcp.txt

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-mcp.txt

      - name: MCP SDK compatibility
        run: python -c "import mcp_server; assert mcp_server.mcp is not None"

      - name: Ruff (lint)
        run: python -m ruff check --output-format=github .

      - name: Mypy (types)
        # Scoped to the typed island declared in pyproject.toml, not the whole
        # 45k-LOC tree. Widen [tool.mypy] files to grow coverage.
        run: python -m mypy

      - name: Pytest
        # Covers the pure-Python contract layer (registry, config, repo
        # integrity) using the fake `unreal` module in tests/conftest.py.
        run: python -m pytest -v

      - name: Repository drift
        run: python scripts/drift_check.py

      - name: Generated coverage
        run: python scripts/coverage_report.py --check

      - name: Generated API manifest
        run: python scripts/gen_api_manifest.py --check

  # Everything above runs off-editor. It cannot prove a tool works against a
  # live UEFN session — see the mandatory in-editor test policy in CLAUDE.md
  # (deploy.bat -> guarded reload or full restart -> tb.run(...)) before merging changes.
